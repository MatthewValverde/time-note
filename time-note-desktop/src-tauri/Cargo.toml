[package]
name = "time-app-desktop"
version = "1.0.0"
description = "A simple calendar-based time tracker"
authors = ["Mateo"]
edition = "2021"

[lib]
name = "time_app_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
